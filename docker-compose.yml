services:

  db:
    image: postgres:16-alpine
    container_name: pdos-db
    environment:
      POSTGRES_DB: pdos
      POSTGRES_USER: pdos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a secure database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdos"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdos-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: pdos-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pdos:${DB_PASSWORD:?Set DB_PASSWORD to a secure database password}@db:5432/pdos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a securely generated value}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      SEED_DB: ${SEED_DB:-false}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # Backend is only reachable via nginx on the compose network (and 127.0.0.1),
      # so trust its X-Forwarded-* headers for real client IPs (rate limiting).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pdos-nginx
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
