name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PDOS-Python-Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --extend-exclude=venv,migrations

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports --exclude=venv --exclude=migrations

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PDOS-Python-Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pdos_test
          POSTGRES_USER: pdos
          POSTGRES_PASSWORD: pdos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pdos:pdos_test@localhost:5432/pdos_test
          REDIS_URL: ""
          CORS_ORIGINS: "*"
        run: |
          python scripts/init_prod_db.py
          python -m pytest -v --tb=short
